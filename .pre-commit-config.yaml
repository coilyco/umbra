# pre-commit hooks for the cli-* family. Mirrors the shared cli-* setup with
# the consumer-internal-only hooks (skill regen, trailer, install) removed.
#
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: '(go\.mod|go\.sum)$'
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

      - id: godoc-current
        name: godoc-current.txt up to date
        description: Re-run scripts/check-godoc-current.sh --update if this fails.
        entry: bash scripts/check-godoc-current.sh
        language: system
        types: [go]
        pass_filenames: false

      - id: trufflehog
        name: trufflehog (secret scan, offline)
        description: Detect secrets in staged changes via local trufflehog binary (no API verification).
        entry: trufflehog git file://. --since-commit HEAD --no-verification --no-update --fail
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # BEGIN managed by agentic-os/scripts/apply-agentic-os-hooks.py
  - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    rev: aos-precommit-v0.100.0
    hooks:
      - id: catalog-trifecta
      - id: documentation-placement
      - id: documentation-size
      - id: context-load-points
      - id: code-comments
      - id: actions-run-one-line
      - id: source-doc-refs
      - id: check-skills
      - id: dead-cross-links
      - id: repo-pointer-skills
      - id: misplaced-skills
      - id: agent-compose-size
      - id: agent-compose-dedup
      - id: trufflehog
      - id: pr-guard
      - id: brand-case
      - id: leak-guard
      - id: unresolved-placeholder-guard
      - id: git-workflow
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: mixed-line-ending
      - id: check-json
        exclude: (^|/)\.vscode/
      - id: check-toml
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Forgejo workflows use GitHub Actions syntax; no exclude split is needed yet.
      - id: actionlint
        args:
          - -config-file
          - .github/actionlint.yaml
        files: ^\.forgejo/workflows/.*\.(ya?ml)$
  - repo: https://code.forgejo.org/forgejo/runner
    rev: v12.10.1
    hooks:
      - id: forgejo-runner-validate
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^shell/zshrc$
        args: [--severity=error]
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        # Report, do not rewrite. --force-exclude keeps _typos.toml binding.
        args: [--force-exclude]
  # END managed by agentic-os/scripts/apply-agentic-os-hooks.py
