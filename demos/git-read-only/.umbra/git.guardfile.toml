description = "A git that reads, and commits only through the hooks."

[wrap]
command = ["demo", "git"]
kdl = """
exec git
replace
withhold push {
    reason "nothing in this demo reaches a remote"
    alternative "status"
}
"""

[[wrap.can]]
verb = "run"
resource = "status"

[[wrap.can]]
verb = "run"
resource = "log"

[[wrap.can]]
verb = "run"
resource = "diff"

[[wrap.can]]
verb = "run"
resource = "commit"
kdl = 'deny-flag "--no-verify" aliases="-n"'
