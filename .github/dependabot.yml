# kin-openapi stays below v0.143.0, which breaks spec-lock pruning (COI-3135).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "github.com/getkin/kin-openapi"
        versions: [">=0.143.0"]
    labels:
      - dependencies
      - go
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
