name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
      - name: Configure Go scratch
        run: bash scripts/ci/go-scratch.sh
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: godoc-current.txt up to date
        run: ./scripts/check-godoc-current.sh
  lint:
    runs-on: ubuntu-latest
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
      - name: Configure Go scratch
        run: bash scripts/ci/go-scratch.sh
      - name: golangci-lint
        run: golangci-lint run --timeout=5m --concurrency=1 ./...
  govulncheck:
    runs-on: ubuntu-latest
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
      - name: Configure Go scratch
        run: bash scripts/ci/go-scratch.sh
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
