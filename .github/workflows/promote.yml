# Stage 1 of the two-stage release flow: gate main, draft-tag, fast-forward `release`.
# The App token starts release.yml, which a GITHUB_TOKEN push would not.

name: promote

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: promote-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate-and-promote:
    if: github.repository_owner == 'coilyco'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: coilyco/agentic-os/actions/setup-ci@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          tools: just golangci-lint trufflehog

      - id: app
        uses: coilyco/agentic-os/actions/app-token@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          app_id: ${{ secrets.COILYCO_OPS_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_OPS_APP_PRIVATE_KEY_BASE64 }}

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: godoc-current.txt up to date
        run: ./scripts/check-godoc-current.sh

      - name: go.mod tidy
        run: bash scripts/ci/go-mod-tidy.sh

      - name: golangci-lint
        timeout-minutes: 5
        run: golangci-lint run --timeout=5m ./...

      - name: Scan filesystem for secrets
        run: bash scripts/ci/trufflehog-scan.sh

      - name: Publish draft release tag
        env:
          PROMOTE_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/publish-draft-tag.sh

      - name: Promote main to release (fast-forward only)
        env:
          PROMOTE_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/promote-to-release.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
