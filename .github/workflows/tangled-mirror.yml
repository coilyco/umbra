# Pushes this repo's heads and tags to its Tangled mirror (COI-2939).
# Reasoning and cutover order: .github/scripts/tangled-mirror.sh.
name: Tangled mirror

on:
  push:
    branches: [main]
    tags: ["*"]
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:

concurrency:
  group: tangled-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Push to Tangled
    if: github.repository_owner == 'coilyco'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Push heads and tags, then read main back
        env:
          TANGLED_SSH_KEY: ${{ secrets.TANGLED_SSH_KEY }}
        run: bash .github/scripts/tangled-mirror.sh
