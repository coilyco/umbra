# Stage 2 of the two-stage release flow: verify the draft tag and cut the release.
# Why there is no test job here: docs/release-pipeline.md.

name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository_owner == 'coilyco'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: coilyco/agentic-os/actions/setup-ci@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          tools: just

      - id: app
        uses: coilyco/agentic-os/actions/app-token@22a3de8175621ad56b4c2c1b933b49b43cc5dcdc
        with:
          app_id: ${{ secrets.COILYCO_OPS_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_OPS_APP_PRIVATE_KEY_BASE64 }}
          repositories: umbra,homebrew-tap,scoop-bucket

      - id: draft
        name: Derive the draft release tag
        run: echo "draft_tag=draft-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify the draft release tag was published on main
        env:
          DRAFT_TAG: ${{ steps.draft.outputs.draft_tag }}
        run: bash scripts/ci/verify-draft-tag.sh

      - id: tag
        uses: coilyco/agentic-os/actions/tag-bump@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Build packaged umbra CLI and package metadata
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          VERSION: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/release-artifacts.sh

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/create-release@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Upload umbra-linux-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-linux-amd64

      - name: Upload umbra-linux-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-linux-arm64

      - name: Upload umbra-darwin-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-darwin-amd64

      - name: Upload umbra-darwin-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-darwin-arm64

      - name: Upload umbra-windows-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-windows-amd64.exe

      - name: Upload umbra-windows-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-windows-arm64.exe

      - name: Upload SHA256SUMS
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/SHA256SUMS

      - name: Upload umbra Homebrew formula
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra.rb

      - name: Upload umbra Scoop manifest
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilyco/agentic-os/actions/upload-release-asset@dec64b18f8f74cc792af630d91b2a1814fd5940d
        with:
          token: ${{ steps.app.outputs.token }}
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra.json

      - name: Wait for every release asset to answer on GitHub
        if: ${{ steps.tag.outputs.new_tag != '' }}
        run: bash scripts/ci/wait-github-assets.sh dist

      - name: Update the Homebrew tap
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/release-publish-package.sh homebrew-tap dist/umbra.rb Formula/umbra.rb

      - name: Update the Scoop bucket
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/release-publish-package.sh scoop-bucket dist/umbra.json bucket/umbra.json

      - name: Alert Sentry on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        env:
          ALERT_KIND: Release
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
