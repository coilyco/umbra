# Stage 2 of the two-stage release flow (ward#1117): promote.yml gates every
# main push, publishes the commit-scoped draft tag (`draft-${sha}`), and then
# fast-forwards `release` when green; this pipeline runs on `release` pushes
# only, under a concurrency queue (cancel-in-progress: false) so promoted
# shas release in sequence instead of overlap-and-cancel. A workflow_dispatch
# re-fires it against the `release` ref on a missed enqueue. There is no test
# job here: promote.yml already ran the full repo gate on the exact sha it
# fast-forwarded, so re-running the suite on `release` only lets a flaky rerun
# fail an already-vouched promotion (Kai's call, 2026-07-12).

name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: draft
        name: Derive the draft release tag
        run: |
          set -euo pipefail
          echo "draft_tag=draft-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify the draft release tag was published on main
        run: |
          set -euo pipefail
          git fetch --tags --force
          git rev-parse --verify "refs/tags/${{ steps.draft.outputs.draft_tag }}" >/dev/null
          echo "verified ${{ steps.draft.outputs.draft_tag }}"

      - id: tag
        uses: coilysiren/agentic-os/actions/tag-bump@main

      - name: Build packaged kdl-specs CLI
        if: ${{ steps.tag.outputs.new_tag != '' }}
        run: make release-artifacts VERSION="${{ steps.tag.outputs.new_tag }}" DIST_DIR=dist

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/create-release@main
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Upload kdl-specs-linux-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/kdl-specs-linux-amd64

      - name: Upload kdl-specs-linux-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/kdl-specs-linux-arm64

      - name: Upload kdl-specs-darwin-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/kdl-specs-darwin-amd64

      - name: Upload kdl-specs-darwin-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/kdl-specs-darwin-arm64

      - name: Upload kdl-specs-windows-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/kdl-specs-windows-amd64.exe

      - name: Upload kdl-specs-windows-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/kdl-specs-windows-arm64.exe

      - name: Upload SHA256SUMS
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/SHA256SUMS
      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on release",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
