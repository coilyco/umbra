# Stage 2 of the two-stage release flow: verify the draft tag and cut the release.
# Why there is no test job here: docs/release-pipeline.md.

name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: draft
        name: Derive the draft release tag
        run: echo "draft_tag=draft-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify the draft release tag was published on main
        env:
          DRAFT_TAG: ${{ steps.draft.outputs.draft_tag }}
        run: bash scripts/ci/verify-draft-tag.sh

      - id: tag
        uses: coilysiren/agentic-os/actions/tag-bump@main

      - name: Build packaged umbra CLI and package metadata
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          VERSION: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/release-artifacts.sh

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/create-release@main
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Upload umbra-linux-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-linux-amd64

      - name: Upload umbra-linux-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-linux-arm64

      - name: Upload umbra-darwin-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-darwin-amd64

      - name: Upload umbra-darwin-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-darwin-arm64

      - name: Upload umbra-windows-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-windows-amd64.exe

      - name: Upload umbra-windows-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra-windows-arm64.exe

      - name: Upload SHA256SUMS
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/SHA256SUMS

      - name: Upload umbra Homebrew formula
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra.rb

      - name: Upload umbra Scoop manifest
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/umbra.json

      - name: Update the Homebrew tap
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/update-homebrew-tap.sh

      - name: Update the Scoop bucket
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash scripts/ci/update-scoop-bucket.sh

      - name: Alert Sentry on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        env:
          ALERT_KIND: Release
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
